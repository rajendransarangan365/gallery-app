name: Build & Publish Releases (Dual-Repo Pipeline)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # Job 1: Test & Quality Gate
  # -------------------------------------------------------------
  test-and-audit:
    name: Lint, Typecheck & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@latest

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run Lint & Type Check
        run: pnpm turbo run lint typecheck

      - name: Run Unit & Security Tests
        run: pnpm turbo run test

  # -------------------------------------------------------------
  # Job 2: Build Windows Installer (.exe)
  # -------------------------------------------------------------
  build-windows:
    name: Build Windows Desktop Installer
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@latest

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build All Monorepo Packages
        run: pnpm turbo run build

      - name: Package Windows Executable (NSIS Installer)
        run: npx --yes electron-builder --win nsis:x64 --publish never --config.directories.output=dist-installer
        working-directory: apps/windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: apps/windows/dist-installer/*.exe

  # -------------------------------------------------------------
  # Job 3: Build Android Release APK
  # -------------------------------------------------------------
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@latest

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build All Monorepo Workspace Packages
        run: pnpm turbo run build

      - name: Build Android Release APK
        run: |
          cd apps/android/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apps/android/android/app/build/outputs/apk/release/*.apk

  # -------------------------------------------------------------
  # Job 4: Publish to Public Releases Repository
  # -------------------------------------------------------------
  publish-public-release:
    name: Publish Artifacts to Public Repository
    needs: [build-windows, build-android]
    if: always() && (needs.build-windows.result == 'success' || needs.build-android.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: windows-installer
          path: dist-release/

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: android-apk
          path: dist-release/

      - name: Generate Checksums
        run: |
          cd dist-release
          sha256sum * > SHA256SUMS.txt || true
          cat SHA256SUMS.txt || true

      - name: Generate Release Notes
        id: release_notes
        run: |
          VERSION="${{ github.ref_name }}"
          node scripts/generate-release-notes.mjs --version "$VERSION"
          echo "RELEASE_NOTES_PATH=RELEASE_NOTES.md" >> $GITHUB_OUTPUT

      - name: Publish to Public Release Repository
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          repository: rajendransarangan365/gallery-app-release
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            dist-release/*
          draft: false
          prerelease: false

      - name: Publish to Primary Code Repository Releases
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            dist-release/*
          draft: false
          prerelease: false
